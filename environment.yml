name: socialaha
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.14
  - pip
  # Core data
  - numpy
  - pandas
  - scipy
  # Neuroimaging
  - nilearn
  - nibabel
  - joblib
  # Statistics & ML
  - statsmodels
  # Visualization
  - matplotlib
  - seaborn
  - pip:
    # TensorFlow + Hub (for Google Universal Sentence Encoder in step03)
    - tensorflow
    - tensorflow-hub
